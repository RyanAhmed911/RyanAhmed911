name: Update profile assets

on:
  schedule:
    - cron: "0 */12 * * *"  
  workflow_dispatch:          
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Restore previously cached assets
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: output
          path: prev

      - name: Seed dist with last known-good assets
        run: |
          mkdir -p dist
          if [ -d prev ]; then
            find prev -maxdepth 1 -name '*.svg' -exec cp {} dist/ \; || true
          fi
          ls -la dist || true

      - name: Generate snake animation
        continue-on-error: true
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Refresh stat cards
        env:
          USER: ${{ github.repository_owner }}
        run: |
          mkdir -p tmp

          # fetch <name> <url> — writes dist/<name>.svg only on success
          fetch () {
            name="$1"; url="$2"
            if curl -fsSL --retry 4 --retry-all-errors --retry-delay 5 \
                    --max-time 45 -o "tmp/$name.svg" "$url"; then
              if [ -s "tmp/$name.svg" ]; then
                mv "tmp/$name.svg" "dist/$name.svg"
                echo "::notice::$name refreshed"
                return 0
              fi
            fi
            echo "::warning::$name failed to refresh — keeping previous copy"
            echo "::warning::  url was $url"
            return 1
          }

          fetch stats \
            "https://github-readme-stats.vercel.app/api?username=$USER&show_icons=true&hide_border=true&theme=tokyonight&include_all_commits=true" || true

          fetch top-langs \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=$USER&layout=compact&hide_border=true&theme=tokyonight&langs_count=8" || true

          fetch streak \
            "https://streak-stats.demolab.com?user=$USER&hide_border=true&theme=tokyonight" \
            || fetch streak \
            "https://github-readme-streak-stats-eight.vercel.app?user=$USER&hide_border=true&theme=tokyonight" \
            || true

          fetch trophies \
            "https://github-profile-trophy.vercel.app/?username=$USER&theme=tokyonight&no-frame=true&no-bg=true&margin-w=6&column=7" || true

          fetch activity \
            "https://github-readme-activity-graph.vercel.app/graph?username=$USER&theme=tokyo-night&hide_border=true&area=true" || true

          echo "--- assets to publish ---"
          ls -la dist

          if [ -z "$(ls -A dist/*.svg 2>/dev/null)" ]; then
            echo "::error::No assets were produced at all — nothing to publish."
            exit 1
          fi

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
