# Save as: .github/workflows/profile-assets.yml  (in the RyanAhmed911/RyanAhmed911 repo)

name: Update profile assets

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Restore previously cached assets
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: output
          path: prev

      - name: Seed dist with last known-good assets
        run: |
          mkdir -p dist tmp
          if [ -d prev ]; then
            find prev -maxdepth 1 -name '*.svg' -exec cp {} dist/ \; || true
          fi

      - name: Generate snake animation
        continue-on-error: true
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Refresh stat cards
        env:
          USER: ${{ github.repository_owner }}
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"

          fetch () {
            name="$1"; url="$2"
            code=$(curl -sSL -w '%{http_code}' -o "tmp/$name.svg" \
                     -A "$UA" -H 'Accept: image/svg+xml,image/*,*/*' \
                     --retry 4 --retry-all-errors --retry-delay 8 --max-time 60 \
                     "$url" || echo 000)
            if [ "$code" = "200" ] && [ -s "tmp/$name.svg" ] \
               && head -c 400 "tmp/$name.svg" | grep -qi '<svg'; then
              mv "tmp/$name.svg" "dist/$name.svg"
              echo "::notice::$name refreshed"
              return 0
            fi
            echo "::warning::$name failed (HTTP $code) — keeping previous copy"
            head -c 200 "tmp/$name.svg" 2>/dev/null || true
            return 1
          }

          fetch stats \
            "https://github-readme-stats.vercel.app/api?username=$USER&show_icons=true&hide_border=true&theme=tokyonight&include_all_commits=true" || true

          fetch top-langs \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=$USER&layout=compact&hide_border=true&theme=tokyonight&langs_count=8" || true

          fetch streak \
            "https://streak-stats.demolab.com?user=$USER&hide_border=true&theme=tokyonight" \
            || fetch streak \
            "https://github-readme-streak-stats-eight.vercel.app?user=$USER&hide_border=true&theme=tokyonight" \
            || true

          fetch trophies \
            "https://github-profile-trophy.vercel.app/?username=$USER&theme=tokyonight&no-frame=true&no-bg=true&margin-w=6&column=7" || true

          fetch activity \
            "https://github-readme-activity-graph.vercel.app/graph?username=$USER&theme=tokyo-night&hide_border=true&area=true" || true

          echo "--- assets to publish ---"
          ls -la dist

          if ! ls dist/*.svg >/dev/null 2>&1; then
            echo "::error::No assets were produced at all."
            exit 1
          fi

      - name: Publish to output branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          rm -rf .git
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update profile assets [skip ci]"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
