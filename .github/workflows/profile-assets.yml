name: Update profile assets
 
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
 
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
 
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
 
      - name: Cache stat cards
        env:
          USER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          mkdir -p dist
          fetch () { curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 -o "$1" "$2"; }
 
          fetch dist/stats.svg \
            "https://github-readme-stats.vercel.app/api?username=$USER&show_icons=true&hide_border=true&theme=tokyonight&include_all_commits=true"
 
          fetch dist/top-langs.svg \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=$USER&layout=compact&hide_border=true&theme=tokyonight&langs_count=8"
 
          fetch dist/streak.svg \
            "https://github-readme-streak-stats-eight.vercel.app?user=$USER&hide_border=true&theme=tokyonight"
 
          fetch dist/trophies.svg \
            "https://github-profile-trophy.vercel.app/?username=$USER&theme=tokyonight&no-frame=true&no-bg=true&margin-w=6&column=7"
 
          fetch dist/activity.svg \
            "https://github-readme-activity-graph.vercel.app/graph?username=$USER&theme=tokyo-night&hide_border=true&area=true"
 
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 
